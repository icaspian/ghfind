<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>◇ GHFIND — Leaderboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Kanit:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="bg-grid"></div>

  <nav class="topbar">
    <a class="nav-logo" href="index.html">
      <span class="dia">◇</span> GHFIND
    </a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="leaderboard.html" class="active">Leaderboard</a>
      <a href="https://github.com/7helix/ghfind" target="_blank">CLI Tool</a>
    </div>
  </nav>

  <main class="wrap">
    <section class="hero" style="padding-bottom: 2rem;">
      <h1>GLOBAL LEADERBOARD</h1>
      <p>Top repositories by stars. Live data stream.</p>
      
      <div class="tabs">
        <button class="tab-btn active" data-tab="trending">🔥 TRENDING (7D)</button>
        <button class="tab-btn" data-tab="claude">🤖 CLAUDE / AI</button>
        <button class="tab-btn" data-tab="alltime">🏆 ALL TIME</button>
        <button class="tab-btn" data-tab="search">🔍 CUSTOM</button>
      </div>
    </section>

    <div id="search-container" style="display:none; max-width: 700px; margin: 0 auto 2rem;">
      <div class="search-wrap">
        <input type="text" id="custom-q" placeholder="Search anything on GitHub…" autocomplete="off">
        <button id="custom-btn">RUN</button>
      </div>
    </div>

    <div id="status" class="status" hidden></div>
    <div id="grid" class="grid"></div>
  </main>

  <script>
    const $ = s => document.querySelector(s);
    const $$ = s => [...document.querySelectorAll(s)];

    async function loadLeaderboard(type) {
      $('#status').hidden = false;
      $('#status').innerHTML = '<div class="loader"></div>FETCHING DATA...';
      $('#grid').innerHTML = '';

      let query = '';
      const date = new Date();
      
      if (type === 'trending') {
        date.setDate(date.getDate() - 7);
        query = `created:>${date.toISOString().slice(0,10)}`;
      } else if (type === 'claude') {
        query = 'claude OR anthropic OR llm';
      } else if (type === 'alltime') {
        query = 'stars:>100000';
      }

      try {
        const url = `https://api.github.com/search/repositories?q=${encodeURIComponent(query)}&sort=stars&order=desc&per_page=12`;
        const res = await fetch(url);
        const data = await res.json();

        if (!res.ok) throw new Error(data.message);
        
        renderResults(data.items);
      } catch (e) {
        $('#status').innerHTML = `<span class="error">ERR: ${e.message.toUpperCase()}</span>`;
      }
    }

    async function customSearch(q) {
      if (!q.trim()) return;
      $('#status').hidden = false;
      $('#status').innerHTML = '<div class="loader"></div>SEARCHING...';
      $('#grid').innerHTML = '';

      try {
        const url = `https://api.github.com/search/repositories?q=${encodeURIComponent(q)}&sort=stars&order=desc&per_page=12`;
        const res = await fetch(url);
        const data = await res.json();
        if (!res.ok) throw new Error(data.message);
        
        renderResults(data.items);
      } catch (e) {
        $('#status').innerHTML = `<span class="error">ERR: ${e.message.toUpperCase()}</span>`;
      }
    }

    function renderResults(items) {
      if (items.length === 0) {
        $('#status').textContent = 'NO DATA FOUND.';
        return;
      }
      $('#status').hidden = true;
      
      items.forEach((repo, index) => {
        const rank = index + 1;
        const el = document.createElement('a');
        el.href = repo.html_url;
        el.target = '_blank';
        el.className = 'card' + (rank <= 3 ? ' top-3' : '');
        
        el.innerHTML = `
          <div class="rank-num">#${rank}</div>
          <div class="card-head">
            <img class="card-avatar" src="${repo.owner.avatar_url}" alt="">
            <div class="card-repo">${repo.full_name}</div>
          </div>
          <div class="card-desc">${repo.description || 'No description provided.'}</div>
          <div class="card-stats">
            <span>★ ${repo.stargazers_count.toLocaleString()}</span>
            <span>⑂ ${repo.forks_count.toLocaleString()}</span>
            <span class="lang">${repo.language || 'TXT'}</span>
          </div>
        `;
        $('#grid').appendChild(el);
      });
    }

    // Tab Switching Logic
    $$('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        $$('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        const tab = btn.dataset.tab;
        
        if (tab === 'search') {
          $('#search-container').style.display = 'block';
          $('#grid').innerHTML = '';
          $('#status').hidden = true;
          $('#custom-q').focus();
        } else {
          $('#search-container').style.display = 'none';
          loadLeaderboard(tab);
        }
      });
    });

    // Search Logic
    $('#custom-btn').addEventListener('click', () => customSearch($('#custom-q').value));
    $('#custom-q').addEventListener('keydown', e => {
      if (e.key === 'Enter') customSearch($('#custom-q').value);
    });

    // Load default tab
    loadLeaderboard('trending');
  </script>
</body>
</html>
