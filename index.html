<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>◇ GHFIND — Global Intelligence</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐣</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Kanit:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="bg-grid"></div>
  <canvas id="map-canvas"></canvas>

  <nav class="topbar">
    <a class="nav-logo" href="index.html">
      <span class="dia">◇</span> GHFIND
    </a>
    <div class="nav-links">
      <a href="index.html" class="active">Home</a>
      <a href="leaderboard.html">Leaderboard</a>
      <a href="https://github.com/7helix/ghfind" target="_blank">CLI Tool</a>
    </div>
  </nav>

  <main class="wrap">
    <section class="hero">
      <h1>SEARCH THE NETWORK</h1>
      <p>Discover repositories, track live developer activity, and explore the open-source ecosystem in real-time.</p>
      
      <div class="search-wrap">
        <input type="text" id="q" placeholder="Search repositories (e.g. react, rust, ai)…" autocomplete="off">
        <button id="search-btn">RUN</button>
      </div>
    </section>

    <div id="status" class="status" hidden></div>
    <div id="grid" class="grid"></div>
  </main>

  <script>
    const $ = s => document.querySelector(s);
    
    // ═══════════════════════════════════════════════════════════════
    // CYBER MAP ANIMATION
    // ═══════════════════════════════════════════════════════════════
    const canvas = $('#map-canvas');
    const ctx = canvas.getContext('2d');
    let w, h;
    let hubs = [];
    let pulses = [];

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Tech hubs (x, y percentages)
    const locations = [
      [0.15, 0.3], [0.18, 0.35], // US West
      [0.25, 0.3], [0.28, 0.35], // US Central
      [0.32, 0.3], [0.35, 0.35], // US East
      [0.45, 0.3], [0.48, 0.35], // Europe
      [0.65, 0.45],              // India
      [0.75, 0.35], [0.8, 0.4],  // Asia
      [0.82, 0.25],              // Japan
      [0.85, 0.8],               // Australia
      [0.35, 0.7]                // South America
    ];

    // Generate node grid
    for (let x = 0; x < w; x += 30) {
      for (let y = 0; y < h; y += 30) {
        if (Math.random() > 0.8 && (x > w*0.1 && x < w*0.9 && y > h*0.2 && y < h*0.8)) {
          hubs.push({ x, y, baseOpacity: Math.random() * 0.3 + 0.1, pulse: 0 });
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, w, h);
      
      // Draw nodes
      hubs.forEach(hub => {
        hub.pulse *= 0.95;
        ctx.beginPath();
        ctx.arc(hub.x, hub.y, 1.5, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(0, 229, 255, ${hub.baseOpacity + hub.pulse})`;
        ctx.fill();
      });

      // Draw pulses (lasers)
      for (let i = pulses.length - 1; i >= 0; i--) {
        let p = pulses[i];
        p.progress += 0.015;
        if (p.progress >= 1) {
          pulses.splice(i, 1);
          continue;
        }

        const startX = p.start[0] * w;
        const startY = p.start[1] * h;
        const endX = p.end[0] * w;
        const endY = p.end[1] * h;

        const cx = (startX + endX) / 2;
        const cy = (startY + endY) / 2 - Math.abs(startX - endX) * 0.4;

        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.quadraticCurveTo(cx, cy, endX, endY);
        
        const opacity = Math.sin(p.progress * Math.PI);
        ctx.strokeStyle = `rgba(0, 229, 255, ${opacity * 0.6})`;
        ctx.lineWidth = 1;
        ctx.stroke();

        // Glow dot
        const t = p.progress;
        const px = (1-t)*(1-t)*startX + 2*(1-t)*t*cx + t*t*endX;
        const py = (1-t)*(1-t)*startY + 2*(1-t)*t*cy + t*t*endY;
        
        ctx.beginPath();
        ctx.arc(px, py, 2, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(168, 240, 74, ${opacity})`; // Lime dot
        ctx.fill();
        ctx.shadowColor = '#a8f04a';
        ctx.shadowBlur = 10;
      }
      ctx.shadowBlur = 0;

      requestAnimationFrame(draw);
    }

    // Spawn pulses randomly
    setInterval(() => {
      if (pulses.length < 8) {
        const start = locations[Math.floor(Math.random() * locations.length)];
        const end = locations[Math.floor(Math.random() * locations.length)];
        if (start !== end) {
          pulses.push({ start, end, progress: 0 });
        }
      }
    }, 900);

    draw();

    // ═══════════════════════════════════════════════════════════════
    // SEARCH LOGIC
    // ═══════════════════════════════════════════════════════════════
    async function search(q) {
      if (!q.trim()) return;
      $('#status').hidden = false;
      $('#status').innerHTML = '<div class="loader"></div>SCANNING NETWORK...';
      $('#grid').innerHTML = '';

      try {
        const url = `https://api.github.com/search/repositories?q=${encodeURIComponent(q)}&sort=stars&order=desc&per_page=12`;
        const res = await fetch(url);
        const data = await res.json();

        if (!res.ok) throw new Error(data.message);

        if (data.items.length === 0) {
          $('#status').textContent = 'NO REPOSITORIES FOUND.';
          return;
        }

        $('#status').hidden = true;
        
        data.items.forEach(repo => {
          const el = document.createElement('a');
          el.href = repo.html_url;
          el.target = '_blank';
          el.className = 'card';
          el.innerHTML = `
            <div class="card-head">
              <img class="card-avatar" src="${repo.owner.avatar_url}" alt="">
              <div class="card-repo">${repo.full_name}</div>
            </div>
            <div class="card-desc">${repo.description || 'No description provided.'}</div>
            <div class="card-stats">
              <span>★ ${repo.stargazers_count.toLocaleString()}</span>
              <span>⑂ ${repo.forks_count.toLocaleString()}</span>
              <span class="lang">${repo.language || 'TXT'}</span>
            </div>
          `;
          $('#grid').appendChild(el);
        });

      } catch (e) {
        $('#status').innerHTML = `<span class="error">ERR: ${e.message.toUpperCase()}</span>`;
      }
    }

    $('#search-btn').addEventListener('click', () => search($('#q').value));
    $('#q').addEventListener('keydown', e => {
      if (e.key === 'Enter') search($('#q').value);
    });

  </script>
</body>
</html>
