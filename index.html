<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>◆ Claude Code Hub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◆</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700;800&family=Kanit:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="browser-chrome">
  <div class="os-bar">
    <div class="os-controls"><div class="os-dot red"></div><div class="os-dot yellow"></div><div class="os-dot green"></div></div>
    <div class="browser-tabs"><div class="tab"><span class="favicon">◆</span> Claude Code Hub</div></div>
    <div style="width: 60px;"></div>
  </div>
  
  <div class="toolbar">
    <div class="nav-actions">
      <button id="toggle-sidebar">☰</button>
      <button>←</button><button>→</button><button onclick="location.reload()">↻</button>
    </div>
    <div class="address-bar">
      <span class="address-icon">🔒</span>
      <span class="address-protocol">claude://</span>
      <input id="repo-search" type="text" placeholder="Search topic:claude-code..." autocomplete="off" spellcheck="false">
      <kbd>/</kbd>
    </div>
    <div style="display: flex; gap: 0.5rem; align-items: center;">
      <button id="theme-toggle" class="nav-actions" style="font-size: 1.2rem;">◐</button>
      <button id="submit-btn" class="m-btn primary" style="padding: 0.4rem 1rem; font-size: 0.8rem; border-radius: 8px;">＋ Submit</button>
    </div>
  </div>
</div>

<div class="browser-body">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-title">Explore</div>
    <div class="side-link active" data-cat="all"><span class="icon">⌂</span> All Repos</div>
    <div class="side-link" data-cat="claude-code"><span class="icon">🏛️</span> Core</div>
    <div class="side-link" data-cat="claude-skills"><span class="icon">⚡</span> Skills</div>
    <div class="side-link" data-cat="mcp-server"><span class="icon">🔌</span> MCP Servers</div>
    <div class="side-link" data-cat="claude-api"><span class="icon">🧠</span> API / Frameworks</div>
    <div class="sidebar-title">Library</div>
    <div class="side-link" onclick="toast('Saved locally')"><span class="icon">★</span> Favorites</div>
  </div>

  <div class="viewport" id="viewport">
    <div class="bg-grid"></div>
    <canvas id="map-canvas"></canvas>
    
    <div class="app-content">
      <section class="hero">
        <h1 class="hero-title">CLAUDE CODE HUB</h1>
        <div class="hero-tag">live github api integration · open source ecosystem</div>
        <div class="stats-grid">
          <div class="stat-item"><div class="num" id="stat-repos">0</div><div class="lbl">Repos Loaded</div></div>
          <div class="stat-item"><div class="num" id="stat-stars">0</div><div class="lbl">Total Stars</div></div>
        </div>
      </section>

      <div class="filter-bar">
        <div class="filter-group">
          <label>Sort</label>
          <select id="sort-filter">
            <option value="stars">Stars ↓</option>
            <option value="updated">Recently Updated</option>
            <option value="forks">Forks ↓</option>
          </select>
        </div>
      </div>

      <div class="repo-grid" id="repo-grid"></div>
    </div>
  </div>
</div>

<div class="ticker"><div class="ticker-track" id="ticker"></div></div>

<div class="modal" id="repo-modal" hidden>
  <div class="modal-back" id="modal-back"></div>
  <div class="modal-panel">
    <button class="modal-close" id="modal-close">✕</button>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
