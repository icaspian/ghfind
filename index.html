<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>◇ GHFIND</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐣</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&family=Kanit:wght@600;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <div class="chrome">
      <div class="osbar">
        <div class="dots"><i class="r"></i><i class="y"></i><i class="g"></i></div>
        <div class="tabs"><div class="tab"><span class="ic">◇</span> GHFIND</div></div>
      </div>
      <div class="toolbar">
        <button id="toggle-sb" class="tbtn">☰</button>
        <div class="urlbar">
          <span class="lock">🔒</span>
          <span class="proto" id="proto">ghfind://</span>
          <input id="q" type="text" placeholder="search repos..." autocomplete="off">
          <button id="go" class="gobtn">↵</button>
        </div>
        <button id="theme" class="tbtn">◐</button>
      </div>
    </div>
    <div class="body">
      <div class="sidebar" id="sb">
        <div class="sb-title">Workspace</div>
        <div class="sl active"><span>⌂</span> Home</div>
        <div class="sl" id="nav-favs"><span>★</span> Favorites <span class="badge" id="fc">0</span></div>
        <div class="sl" id="nav-hist"><span>◷</span> History</div>
        <div class="sb-title">System</div>
        <div class="sl" id="nav-settings"><span>⚙</span> Settings</div>
        <div class="sl" id="nav-help"><span>?</span> Shortcuts</div>
      </div>
      <div class="viewport" id="vp">
        <div class="bg-grid"></div>
        <canvas id="cv"></canvas>
        <div class="content">
          <div class="hero">
            <div class="hl">
              <div class="sig"><span class="dot"></span> ONLINE</div>
              <h1 class="title">GHFIND</h1>
              <div class="boxes">
                <div class="box"><div class="k">RATE</div><div class="v" id="rate">—</div></div>
                <div class="box"><div class="k">UTC</div><div class="v" id="utc">—</div></div>
              </div>
            </div>
            <div class="hr">
              <svg class="orbit" viewBox="0 0 500 500">
                <circle cx="250" cy="250" r="80"/><circle cx="250" cy="250" r="160" stroke-dasharray="4 8"/><circle cx="250" cy="250" r="230" stroke-dasharray="2 10"/>
                <polygon points="250,40 460,250 250,460 40,250" fill="none"/>
              </svg>
              <div class="mascot"><div class="glow"></div><div class="glyph">🐣</div></div>
            </div>
          </div>
          <div class="search-area" id="search">
            <div class="s-head"><h2>SEARCH</h2><span class="line"></span></div>
            <div class="chips-bar">
              <div class="chips" id="langs">
                <button class="chip on" data-v="">any</button><button class="chip" data-v="lua">lua</button><button class="chip" data-v="python">py</button><button class="chip" data-v="rust">rust</button><button class="chip" data-v="go">go</button><button class="chip" data-v="javascript">js</button><button class="chip" data-v="typescript">ts</button><button class="chip" data-v="c">c</button><button class="chip" data-v="c++">c++</button>
              </div>
              <div class="chips" id="sorts">
                <button class="chip on" data-v="">best</button><button class="chip" data-v="stars">★</button><button class="chip" data-v="forks">⌥</button><button class="chip" data-v="updated">◷</button>
              </div>
            </div>
            <div class="chips-bar">
              <div class="chips" id="stars">
                <button class="chip on" data-v="">★ any</button><button class="chip" data-v="10">10+</button><button class="chip" data-v="100">100+</button><button class="chip" data-v="1000">1k+</button>
              </div>
              <div class="chips" id="age">
                <button class="chip on" data-v="">◷ any</button><button class="chip" data-v="30">30d</button><button class="chip" data-v="365">1y</button>
              </div>
            </div>
            <div class="chips-bar">
              <button class="chip" id="reset">✕ reset</button>
              <button class="chip" id="rand">⚄ random</button>
              <button class="chip" id="cmp">⊕ compare</button>
              <button class="chip" id="view">▦ grid</button>
            </div>
            <div class="status" id="status"></div>
            <div class="stats" id="stats" hidden></div>
            <div class="grid" id="grid"></div>
            <div class="more-wrap"><button id="more" hidden>LOAD MORE</button></div>
          </div>
        </div>
      </div>
    </div>
    <div class="ticker"><div class="track" id="ticker"></div></div>
  </div>

  <div class="drawer" id="drawer" hidden>
    <div class="db" id="drawer-back"></div>
    <div class="dp">
      <div class="dh">
        <h3 id="dtitle" style="font-family:var(--f-m); color:var(--ac)">Favorites</h3>
        <div id="dactions"></div>
        <button class="mbtn" id="drawer-close">✕</button>
      </div>
      <div class="dbody" id="dbody"></div>
    </div>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="mb" id="modal-back"></div>
    <div class="mp">
      <button class="mbtn mc" id="modal-close">✕</button>
      <div class="mbody" id="mbody"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
